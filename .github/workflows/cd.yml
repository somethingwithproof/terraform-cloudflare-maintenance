name: OpenTofu CD

# Applies deploy/ to one environment, with state in HCP Terraform. See the
# README section "Deploying with HCP Terraform" for the required variables,
# secrets and workspaces.

on:
  push:
    tags:
      - "v*.*.*"
  # checkov:skip=CKV_GHA_7: a deploy, not a build; the inputs pick the environment and override validated settings for one run
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - production
      enabled:
        description: "Serve the maintenance page: keep the environment's MAINTENANCE_ENABLED, or override it for this run"
        required: false
        default: "environment"
        type: choice
        options:
          - environment
          - "true"
          - "false"
      window_start:
        description: "Override the window start for this run (RFC3339, e.g. 2030-04-06T08:00:00Z); empty keeps MAINTENANCE_WINDOW"
        required: false
        default: ""
        type: string
      window_end:
        description: "Override the window end (RFC3339); required with window_start"
        required: false
        default: ""
        type: string
      clear_window:
        description: "Deploy without a window for this run, whatever MAINTENANCE_WINDOW says"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    # Never run two applies against the same workspace at once.
    concurrency:
      group: cd-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: deploy
    # Local execution ignores HCP workspace variables, so every input comes
    # from here. Secrets and variables are the GitHub environment's own; see
    # the README section "Deploying with HCP Terraform".
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: cloudflare-maintenance-${{ inputs.environment || 'dev' }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
      TF_VAR_worker_route: ${{ vars.WORKER_ROUTE }}
      TF_VAR_environment: ${{ inputs.environment || 'dev' }}
      # Durable settings: the GitHub environment's variables. A tag push
      # deploys exactly these, so it never switches maintenance on or off.
      ENV_ENABLED: ${{ vars.MAINTENANCE_ENABLED }}
      ENV_WINDOW: ${{ vars.MAINTENANCE_WINDOW }}
      ENV_ALLOWED_IPS: ${{ vars.ALLOWED_IPS }}
      ENV_ALLOWED_REGIONS: ${{ vars.ALLOWED_REGIONS }}
      ENV_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      # One-run overrides from a manual dispatch.
      INPUT_ENABLED: ${{ inputs.enabled || 'environment' }}
      INPUT_WINDOW_START: ${{ inputs.window_start }}
      INPUT_WINDOW_END: ${{ inputs.window_end }}
      INPUT_CLEAR_WINDOW: ${{ inputs.clear_window || false }}

    steps:
      # Fail before init so a missing setting can never fall back to local
      # state, and before any apply so a malformed setting changes nothing.
      - name: Resolve deploy settings
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          missing=()
          for name in TF_CLOUD_ORGANIZATION TF_TOKEN_app_terraform_io \
            CLOUDFLARE_API_TOKEN TF_VAR_cloudflare_account_id \
            TF_VAR_cloudflare_zone_id TF_VAR_worker_route; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Not configured for HCP Terraform deploys; missing: ${missing[*]}. Set the variables and environment secrets described in the README."
            exit 1
          fi

          fail() { echo "::error::$1"; exit 1; }
          # setvar NAME VALUE: exports a TF_VAR_ for the plan. jq -c makes
          # it one line, so nothing else can be written to GITHUB_ENV.
          setvar() { printf 'TF_VAR_%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; }

          enabled=${ENV_ENABLED:-false}
          [[ "$INPUT_ENABLED" == environment ]] || enabled=$INPUT_ENABLED
          [[ "$enabled" == true || "$enabled" == false ]] ||
            fail "MAINTENANCE_ENABLED must be true or false."
          setvar enabled "$enabled"

          rfc3339='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
          window=$ENV_WINDOW
          if [[ "$INPUT_CLEAR_WINDOW" == true ]]; then
            window=
          elif [[ -n "$INPUT_WINDOW_START" || -n "$INPUT_WINDOW_END" ]]; then
            [[ "$INPUT_WINDOW_START" =~ $rfc3339 && "$INPUT_WINDOW_END" =~ $rfc3339 ]] ||
              fail "Set both window_start and window_end as RFC3339 times, or neither."
            window=$(jq -cn --arg s "$INPUT_WINDOW_START" --arg e "$INPUT_WINDOW_END" '{start_time: $s, end_time: $e}')
          fi
          if [[ -n "$window" ]]; then
            window=$(jq -ce 'select(type == "object" and (.start_time | type) == "string" and (.end_time | type) == "string") | {start_time, end_time}' <<<"$window") ||
              fail 'MAINTENANCE_WINDOW must be a JSON object {"start_time": "...", "end_time": "..."}.'
            setvar maintenance_window "$window"
          fi

          # setlist TFVAR NAME VALUE: a JSON array of strings, if set.
          setlist() {
            [[ -n "$3" ]] || return 0
            local list
            list=$(jq -ce 'select(type == "array" and all(.[]; type == "string"))' <<<"$3") ||
              fail "$2 must be a JSON array of strings."
            setvar "$1" "$list"
          }
          setlist allowed_ips ALLOWED_IPS "$ENV_ALLOWED_IPS"
          setlist allowed_regions ALLOWED_REGIONS "$ENV_ALLOWED_REGIONS"

          if [[ -n "$ENV_CONTACT_EMAIL" ]]; then
            [[ "$ENV_CONTACT_EMAIL" != *$'\n'* ]] || fail "CONTACT_EMAIL must be one line."
            setvar contact_email "$ENV_CONTACT_EMAIL"
          fi

      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.10
          tofu_wrapper: false

      # The committed lock file pins the provider build; never change it here.
      - name: OpenTofu Init
        run: tofu init -lockfile=readonly

      - name: OpenTofu Plan
        run: tofu plan -out=tfplan

      - name: OpenTofu Apply
        run: tofu apply tfplan

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
