name: OpenTofu CD

# Applies deploy/ to one environment, with state in HCP Terraform. See the
# README section "Deploying with HCP Terraform" for the required variables,
# secrets and workspaces.

on:
  push:
    tags:
      - "v*.*.*"
  # checkov:skip=CKV_GHA_7: a deploy, not a build; the inputs pick the environment and override validated settings for one run
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - production
      enabled:
        description: "Serve the maintenance page: keep the environment's MAINTENANCE_ENABLED, or override it for this run"
        required: false
        default: "environment"
        type: choice
        options:
          - environment
          - "true"
          - "false"
      window_start:
        description: "Override the window start for this run (RFC3339, e.g. 2030-04-06T08:00:00Z); empty keeps MAINTENANCE_WINDOW"
        required: false
        default: ""
        type: string
      window_end:
        description: "Override the window end (RFC3339); required with window_start"
        required: false
        default: ""
        type: string
      clear_window:
        description: "Deploy without a window for this run, whatever MAINTENANCE_WINDOW says"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    # Never run two applies against the same workspace at once.
    concurrency:
      group: cd-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: deploy
    # Local execution ignores HCP workspace variables, so every input comes
    # from here. Secrets and variables are the GitHub environment's own; see
    # the README section "Deploying with HCP Terraform".
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: cloudflare-maintenance-${{ inputs.environment || 'dev' }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
      TF_VAR_worker_route: ${{ vars.WORKER_ROUTE }}
      TF_VAR_environment: ${{ inputs.environment || 'dev' }}
      # Durable settings: the GitHub environment's variables. A tag push
      # deploys exactly these, so it never switches maintenance on or off.
      ENV_ENABLED: ${{ vars.MAINTENANCE_ENABLED }}
      ENV_WINDOW: ${{ vars.MAINTENANCE_WINDOW }}
      ENV_ALLOWED_IPS: ${{ vars.ALLOWED_IPS }}
      ENV_ALLOWED_REGIONS: ${{ vars.ALLOWED_REGIONS }}
      ENV_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      ENV_RUNTIME_TOGGLE: ${{ vars.RUNTIME_TOGGLE }}
      # One-run overrides from a manual dispatch.
      INPUT_ENABLED: ${{ inputs.enabled || 'environment' }}
      INPUT_WINDOW_START: ${{ inputs.window_start }}
      INPUT_WINDOW_END: ${{ inputs.window_end }}
      INPUT_CLEAR_WINDOW: ${{ inputs.clear_window || false }}

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      # Fail before init so a missing setting can never fall back to local
      # state, and before any apply so a malformed setting changes nothing.
      - name: Resolve deploy settings
        working-directory: .
        run: .github/scripts/deploy-settings.sh

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.10
          tofu_wrapper: false

      # The committed lock file pins the provider build; never change it here.
      - name: OpenTofu Init
        run: tofu init -lockfile=readonly

      - name: OpenTofu Plan
        run: tofu plan -out=tfplan

      - name: OpenTofu Apply
        run: tofu apply tfplan

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
