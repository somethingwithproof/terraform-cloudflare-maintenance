name: OpenTofu CI

# No path filters: these jobs are required status checks, so they must
# report on every pull request, documentation-only ones included.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default permissions are read-only
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OpenTofu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.10
          # Call the tofu binary directly; the Node wrapper only re-exports outputs.
          tofu_wrapper: false

      - name: OpenTofu Init
        run: tofu init -backend=false

      - name: OpenTofu Validate
        run: tofu validate

  validate-roots:
    name: Validate ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - examples/advanced-config
          - examples/basic-usage
          - examples/scheduled-maintenance
          - deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.10
          tofu_wrapper: false

      # -backend=false skips the HCP Terraform cloud block in deploy/. deploy/
      # has a committed lock file that must cover its providers unchanged.
      - name: Validate
        working-directory: ${{ matrix.dir }}
        run: |
          if [[ -f .terraform.lock.hcl ]]; then
            tofu init -backend=false -lockfile=readonly
          else
            tofu init -backend=false
          fi
          tofu validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@0c688f0e33c43029df9334b85caeff28837a53bd # v6
        with:
          tflint_version: v0.50.0

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint -f compact

  # The README input, output and resource tables are generated; fail when
  # they no longer match variables.tf and outputs.tf.
  docs:
    name: Generated Docs
    runs-on: ubuntu-latest
    env:
      TERRAFORM_DOCS_VERSION: v0.24.0
      # sha256 of terraform-docs-v0.24.0-linux-amd64.tar.gz from the release's
      # terraform-docs-v0.24.0.sha256sum.
      TERRAFORM_DOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Install terraform-docs
        run: |
          set -euo pipefail
          archive="terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/${archive}"
          echo "${TERRAFORM_DOCS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" terraform-docs
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Regenerate the module READMEs
        run: |
          terraform-docs .
          (cd modules/notifications && terraform-docs -c ../../.terraform-docs.yml .)

      - name: Fail if they changed
        run: |
          if ! git diff --exit-code -- README.md modules/notifications/README.md; then
            echo "::error::The generated README tables are stale. Run 'terraform-docs .' and, in modules/notifications, 'terraform-docs -c ../../.terraform-docs.yml .', then commit."
            exit 1
          fi

  # Checkov scans the OpenTofu code, the workflows and every file for
  # secrets, and fails on any finding. Suppress a finding only inline, next
  # to the code, with the reason:  # checkov:skip=CKV_XXX_N: why it is safe
  config-scan:
    name: Config Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload the SARIF report to code scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0 (checkov 3.4.3)
        with:
          directory: .
          framework: terraform,github_actions,secrets
          skip_path: worker/node_modules
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      # Code scanning ignores SARIF suppressions and would open an alert for
      # every inline checkov:skip, so drop suppressed results before upload.
      - name: Drop inline-suppressed findings from the report
        if: always()
        run: |
          jq '.runs[].results |= map(select((.suppressions // []) == []))' checkov.sarif > checkov.filtered.sarif
          mv checkov.filtered.sarif checkov.sarif

      # Uploaded even when the scan fails, so the findings show in the
      # pull request. Forks get a read-only token and cannot upload.
      - name: Upload SARIF report
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: checkov.sarif
          category: checkov

      # Known vulnerabilities in the Go and npm dependencies, reported to code
      # scanning without failing the job: a new advisory should not break
      # every open pull request. Dependabot opens the fixes.
      - name: Scan dependencies with Trivy
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-deps.sarif

      - name: Upload dependency scan
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-dependencies

  test-worker:
    name: Test Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci --ignore-scripts

      - name: Type check
        working-directory: worker
        run: npm run typecheck

      - name: Lint
        working-directory: worker
        run: npm run lint

      # Worker tests run in workerd; the notify.sh tests in Node.
      - name: Run tests
        working-directory: worker
        run: npm run test:coverage

      # Terraform deploys the committed bundle, so it must be what the
      # sources build to.
      - name: Check the committed bundle is current
        working-directory: worker
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist/index.js)" ]; then
            git diff --stat -- dist/index.js
            echo "::error file=worker/dist/index.js::worker/dist/index.js is not the build of worker/src. Run 'npm run build' in worker/ and commit the result."
            exit 1
          fi

      - name: Upload test coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          directory: ./worker/coverage/
          flags: worker
          fail_ci_if_error: false

  test-opentofu:
    name: Run OpenTofu Tests
    runs-on: ubuntu-latest
    needs: [validate, tflint, config-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.10
          # Call the tofu binary directly; the Node wrapper only re-exports outputs.
          tofu_wrapper: false

      - name: OpenTofu Init
        run: tofu init -backend=false

      # The test files use mock_provider, so no Cloudflare API calls or credentials.
      - name: Run OpenTofu Tests
        run: tofu test

      # Plans only, so no notification is sent.
      - name: Run notifications module tests
        working-directory: modules/notifications
        run: |
          tofu init -backend=false
          tofu test

      # Real applies with a stub curl, so nothing is sent.
      - name: Check the PagerDuty incident handoff
        run: modules/notifications/tests/apply-handoff.sh
