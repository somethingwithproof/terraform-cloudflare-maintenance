name: OpenTofu CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Default permissions are read-only
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OpenTofu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.10
          # Call the tofu binary directly; the Node wrapper only re-exports outputs.
          tofu_wrapper: false

      - name: OpenTofu Init
        run: tofu init -backend=false

      - name: OpenTofu Validate
        run: tofu validate

  validate-roots:
    name: Validate ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - examples/advanced-config
          - examples/basic-usage
          - examples/scheduled-maintenance
          - deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.10
          tofu_wrapper: false

      # -backend=false skips the HCP Terraform cloud block in deploy/. deploy/
      # has a committed lock file that must cover its providers unchanged.
      - name: Validate
        working-directory: ${{ matrix.dir }}
        run: |
          if [[ -f .terraform.lock.hcl ]]; then
            tofu init -backend=false -lockfile=readonly
          else
            tofu init -backend=false
          fi
          tofu validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@0c688f0e33c43029df9334b85caeff28837a53bd # v6
        with:
          tflint_version: v0.50.0

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint -f compact

  tfsec:
    name: TFSec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Run TFSec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          soft_fail: false

  test-worker:
    name: Test Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      # worker.js lives at the repo root; its Vitest suites live in tests/.
      - name: Install dependencies
        working-directory: tests
        run: npm ci --ignore-scripts

      - name: Run tests
        working-directory: tests
        run: npm run test:coverage

      - name: Upload test coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          directory: ./tests/coverage/
          flags: worker
          fail_ci_if_error: false

  test-opentofu:
    name: Run OpenTofu Tests
    runs-on: ubuntu-latest
    needs: [validate, tflint, tfsec]
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.10
          # Call the tofu binary directly; the Node wrapper only re-exports outputs.
          tofu_wrapper: false

      - name: OpenTofu Init
        run: tofu init -backend=false

      # The test files use mock_provider, so no Cloudflare API calls or credentials.
      - name: Run OpenTofu Tests
        run: tofu test

      # Plans only, so no notification is sent.
      - name: Run notifications module tests
        working-directory: modules/notifications
        run: |
          tofu init -backend=false
          tofu test
