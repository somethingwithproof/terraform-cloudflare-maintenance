name: E2E Tests

# Applies the module to a real Cloudflare zone with Terratest, deploys,
# asserts and destroys. Manual only: the unit, OpenTofu, lint and security
# checks run on every pull request in ci.yml. Without the CF_E2E_* settings
# below the run succeeds with a warning that the tests were skipped.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TOFU_VERSION: "1.8.10"

jobs:
  terratest:
    name: Terratest E2E
    runs-on: ubuntu-latest
    # The settings are secrets and variables of the e2e environment, which
    # only runs from main, so a pull request can never reach the test zone.
    environment: e2e
    # One run at a time: tests use unique names, but share the zone's quota.
    concurrency:
      group: e2e
      cancel-in-progress: false
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tests/e2e
    # The Go tests read these and skip when any is missing; the provider reads
    # CLOUDFLARE_API_TOKEN directly. Use a dedicated test zone: the tests
    # create Workers and routes there. CF_E2E_RATE_LIMIT_ZONE_ID is optional
    # and must be a throwaway zone, because that test deletes the zone's rate
    # limiting rules.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_E2E_API_TOKEN }}
      CF_E2E_ACCOUNT_ID: ${{ secrets.CF_E2E_ACCOUNT_ID }}
      CF_E2E_ZONE_ID: ${{ secrets.CF_E2E_ZONE_ID }}
      CF_E2E_ZONE_NAME: ${{ vars.CF_E2E_ZONE_NAME }}
      CF_E2E_RATE_LIMIT_ZONE_ID: ${{ secrets.CF_E2E_RATE_LIMIT_ZONE_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: tests/e2e/go.sum

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          # Call the tofu binary directly; the Node wrapper only re-exports outputs.
          tofu_wrapper: false

      - name: Download Go dependencies
        run: go mod download

      # The tests skip without these, which go test reports as a pass; say so
      # loudly instead of letting a misnamed secret look like a green run.
      - name: Check E2E configuration
        id: config
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CF_E2E_ACCOUNT_ID CF_E2E_ZONE_ID CF_E2E_ZONE_NAME; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::warning::E2E tests skipped; not configured: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Terratest E2E tests
        if: steps.config.outputs.ready == 'true'
        # Each test registers its destroy with t.Cleanup, so resources are
        # removed even when an assertion fails; -timeout stays below the job
        # timeout so the cleanups get to run.
        run: go test -v -timeout 35m ./...
