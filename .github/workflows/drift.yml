name: Drift Detection

# Plans each environment's deploy/ root against its HCP Terraform state and
# the live Cloudflare resources, and keeps one issue per environment open
# while they differ. Read-only: it never applies, takes no state lock and
# uploads only the changed resource addresses, never plan values.
#
# The weekly run covers dev and staging. production requires a reviewer for
# every job that uses its environment, so it is planned only from Run
# workflow with include_production. An environment without the HCP settings
# is skipped with a notice.

on:
  schedule:
    - cron: "17 6 * * 1"
  # checkov:skip=CKV_GHA_7: a read-only plan, not a build; the input only adds production to the matrix
  workflow_dispatch:
    inputs:
      include_production:
        description: "Also plan production (waits for its required reviewer)"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  plan:
    name: Plan ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.include_production && '["dev", "staging", "production"]' || '["dev", "staging"]') }}
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: deploy
    # The same settings cd.yml deploys with, without one-run overrides.
    env:
      DEPLOY_SETTINGS_MODE: plan
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: cloudflare-maintenance-${{ matrix.environment }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
      TF_VAR_worker_route: ${{ vars.WORKER_ROUTE }}
      TF_VAR_environment: ${{ matrix.environment }}
      ENV_ENABLED: ${{ vars.MAINTENANCE_ENABLED }}
      ENV_WINDOW: ${{ vars.MAINTENANCE_WINDOW }}
      ENV_ALLOWED_IPS: ${{ vars.ALLOWED_IPS }}
      ENV_ALLOWED_REGIONS: ${{ vars.ALLOWED_REGIONS }}
      ENV_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      ENV_RUNTIME_TOGGLE: ${{ vars.RUNTIME_TOGGLE }}
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
        with:
          persist-credentials: false

      - name: Resolve deploy settings
        id: settings
        working-directory: .
        run: .github/scripts/deploy-settings.sh

      - name: Setup OpenTofu
        if: steps.settings.outputs.ready == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.10
          tofu_wrapper: false

      - name: OpenTofu Init
        if: steps.settings.outputs.ready == 'true'
        run: tofu init -lockfile=readonly

      # -detailed-exitcode: 0 no changes, 2 changes, 1 error. -lock=false so
      # a weekly check never blocks or races a deploy.
      - name: Plan
        if: steps.settings.outputs.ready == 'true'
        run: |
          REPORT="$RUNNER_TEMP/drift-$ENVIRONMENT.json"
          set +e
          tofu plan -detailed-exitcode -lock=false -no-color -out=tfplan > "$RUNNER_TEMP/plan.log" 2>&1
          code=$?
          set -e
          case "$code" in
          0) status=clean ;;
          2) status=drift ;;
          *) status=error ;;
          esac
          # Addresses and actions only: plan values can hold secrets.
          changes='[]'
          if [ "$status" = drift ]; then
            changes=$(tofu show -json tfplan | jq -c '[.resource_changes[]? | select(.change.actions != ["no-op"]) | {address, actions: .change.actions}]')
          fi
          jq -n --arg environment "$ENVIRONMENT" --arg status "$status" --argjson changes "$changes" \
            '{environment: $environment, status: $status, changes: $changes}' > "$REPORT"
          cat "$REPORT"
          if [ "$status" = error ]; then
            # The log can name resources but not secrets; values are redacted
            # by the sensitive variables and outputs.
            tail -n 40 "$RUNNER_TEMP/plan.log"
            echo "::error::The plan for $ENVIRONMENT failed."
            exit 1
          fi

      - name: Upload the drift report
        if: steps.settings.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-${{ matrix.environment }}
          path: ${{ runner.temp }}/drift-${{ matrix.environment }}.json
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Update drift issues
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: drift-*
          path: ${{ runner.temp }}/drift
          merge-multiple: true

      - name: Create, update or close one issue per environment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIR: ${{ runner.temp }}/drift
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=("$DIR"/drift-*.json)
          if (( ${#reports[@]} == 0 )); then
            echo "No environment was planned."
            exit 0
          fi
          for report in "${reports[@]}"; do
            environment=$(jq -r .environment "$report")
            status=$(jq -r .status "$report")
            title="Drift: $environment differs from deploy/"
            number=$(gh issue list --state open --app github-actions --limit 100 --json number,title |
              jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
            case "$status" in
            drift)
              {
                echo "The weekly plan of \`deploy/\` for **$environment** would change these resources:"
                echo
                jq -r '.changes[] | "- `\(.address)`: \(.actions | join(", "))"' "$report"
                echo
                echo "Run: $RUN_URL. Deploy from **OpenTofu CD > Run workflow** to bring Cloudflare back to the configuration, or update the configuration to match. Values are not shown; plan locally to see them."
              } > "$RUNNER_TEMP/body.md"
              if [ -n "$number" ]; then
                gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
                gh issue comment "$number" --body "Still drifting as of $RUN_URL."
              else
                gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
              fi
              ;;
            clean)
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "No drift as of $RUN_URL. Closing."
                gh issue close "$number" --reason completed
              fi
              ;;
            *) echo "$environment: plan failed; see $RUN_URL" ;;
            esac
          done
