version: 2
updates:
  # =============================================
  # GitHub Actions
  # =============================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # Terraform (root module, local modules, GitHub org config, test harness)
  # github-org-terraform/security-enhanced is not tracked: its module "backend_setup"
  # points at ./modules/backend-setup, which does not exist, so the directory cannot be parsed.
  # =============================================
  - package-ecosystem: "terraform"
    directories:
      - "/"
      - "/modules/notifications"
      - "/github-org-terraform"
      - "/tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      terraform-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # npm (tests/package.json; no lockfile is tracked)
  # =============================================
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # Go (terratest suite; tests/integration/go.mod has no requirements)
  # =============================================
  - package-ecosystem: "gomod"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      gomod-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # pre-commit
  # =============================================
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pre-commit-minor-patch:
        update-types:
          - "minor"
          - "patch"
