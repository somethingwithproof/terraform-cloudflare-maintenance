version: 2
updates:
  # =============================================
  # GitHub Actions
  # =============================================
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # Terraform (root module and local modules: provider constraints)
  # =============================================
  - package-ecosystem: "terraform"
    cooldown:
      default-days: 7
    directories:
      - "/"
      - "/modules/notifications"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      terraform-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # OpenTofu (deploy root: provider lock file for registry.opentofu.org)
  # =============================================
  - package-ecosystem: "opentofu"
    cooldown:
      default-days: 7
    directory: "/deploy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      opentofu-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # npm (worker/package.json and worker/package-lock.json). A wrangler
  # update can change the bundle; CI then asks for a rebuilt
  # worker/dist/index.js on the pull request.
  # =============================================
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # Go (terratest suite)
  # =============================================
  - package-ecosystem: "gomod"
    cooldown:
      default-days: 7
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      gomod-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # pre-commit
  # =============================================
  - package-ecosystem: "pre-commit"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pre-commit-minor-patch:
        update-types:
          - "minor"
          - "patch"
