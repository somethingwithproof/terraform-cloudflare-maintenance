version: 2
updates:
  # =============================================
  # GitHub Actions
  # =============================================
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # Terraform (root module, local modules and the deploy root)
  # =============================================
  - package-ecosystem: "terraform"
    cooldown:
      default-days: 7
    directories:
      - "/"
      - "/modules/notifications"
      - "/deploy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      terraform-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # npm (tests/package.json and tests/package-lock.json)
  # =============================================
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # Go (terratest suite)
  # =============================================
  - package-ecosystem: "gomod"
    cooldown:
      default-days: 7
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      gomod-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # =============================================
  # pre-commit
  # =============================================
  - package-ecosystem: "pre-commit"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pre-commit-minor-patch:
        update-types:
          - "minor"
          - "patch"
